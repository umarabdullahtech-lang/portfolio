<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">System architecture placeholder</title>
  <description id="description">A dark technical grid with connected acid-green and violet system nodes.</description>
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#f5f2e9" stroke-opacity=".07"/>
    </pattern>
    <radialGradient id="glow" cx="62%" cy="45%" r="58%">
      <stop offset="0" stop-color="#8662ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#050609" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#050609"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round">
    <ellipse cx="800" cy="500" rx="420" ry="270" stroke="#d8ff3e" stroke-opacity=".24" stroke-width="2" transform="rotate(-11 800 500)"/>
    <ellipse cx="800" cy="500" rx="510" ry="205" stroke="#8662ff" stroke-opacity=".36" stroke-width="2" transform="rotate(18 800 500)"/>
    <path d="M455 315 800 500 1145 300M800 500 1160 695M800 500 455 705" stroke="#f5f2e9" stroke-opacity=".22" stroke-width="2" stroke-dasharray="8 14"/>
  </g>
  <g font-family="JetBrains Mono,monospace" text-anchor="middle">
    <circle cx="800" cy="500" r="132" fill="#0b0d12" stroke="#d8ff3e" stroke-width="3"/>
    <circle cx="800" cy="500" r="151" fill="none" stroke="#d8ff3e" stroke-opacity=".17" stroke-width="18" filter="url(#softGlow)"/>
    <text x="800" y="480" fill="#777f8e" font-size="20" letter-spacing="5">SYSTEM CORE</text>
    <text x="800" y="530" fill="#f5f2e9" font-size="35" font-weight="700" letter-spacing="2">ENGINEERING</text>
    <g fill="#0b0d12" stroke="#f5f2e9" stroke-opacity=".28" stroke-width="2">
      <rect x="335" y="250" width="240" height="112" rx="20"/>
      <rect x="1025" y="240" width="240" height="112" rx="20"/>
      <rect x="1040" y="640" width="240" height="112" rx="20"/>
      <rect x="335" y="650" width="240" height="112" rx="20"/>
    </g>
    <g fill="#d8ff3e" font-size="18" font-weight="700" letter-spacing="4">
      <text x="455" y="317">INPUT</text>
      <text x="1145" y="307">PROCESS</text>
      <text x="1160" y="707">INTEGRATE</text>
      <text x="455" y="717">DELIVER</text>
    </g>
  </g>
</svg>
