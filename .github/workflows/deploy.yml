name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Deploys run one at a time; a newer push waits for the current one to finish.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Only lets the build load the auth module. This build is a check; the server
          # builds again with its own .env, so this value is never used at runtime.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Deploy to production server
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # On the server this key can only run `sudo /usr/local/sbin/portfolio-deploy`
          # (scripts/server/portfolio-deploy.sh): build beside the live app, back up and
          # migrate the database, swap, health-check, and roll back on failure.
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$SSH_USER@$SSH_HOST"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const commit_sha = context.sha.substring(0, 7);
            const body = [
              `## Deployment Failed`,
              ``,
              `**Commit:** \`${commit_sha}\` — ${context.payload.commits?.[0]?.message ?? 'no message'}`,
              `**Branch:** \`${context.ref.replace('refs/heads/', '')}\``,
              `**Run:** [View logs](${run_url})`,
              ``,
              `The production deploy failed. A failure before the swap leaves the live site untouched; a failed health check after the swap restores the previous build automatically. Check \`/var/log/portfolio-deploy.log\` on portfolio-vm and the Actions run logs for details.`,
            ].join('\n');
            await github.rest.issues.create({
              owner,
              repo,
              title: `Deploy failed: ${commit_sha}`,
              body,
              labels: ['deploy-failure'],
            });
